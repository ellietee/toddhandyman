<script>
const carouselImages = [
  'images/work1.jpg',
  'images/work2.jpg',
  'images/work3.jpg',
  'images/work4.jpg',
  'images/work5.jpg',
  'images/work6.jpg',
  'images/work7.jpg',
  'images/work8.jpg',
  'images/work9.jpg',
  'images/work10.jpg', 
  'images/work11.jpg',
  'images/work12.jpg',
  'images/work13.jpg',
  'images/work14.jpg',
  'images/work15.jpg',
  'images/work16.jpg',
  'images/work17.jpg',
  'images/work18.jpg',
  'images/work19.jpg',
  'images/work20.jpg',
  'images/work21.jpg',
  'images/work22.jpg',
  'images/work23.jpg',
  'images/work24.jpg',
  'images/work25.jpg'
];
let currentIndex = 0;
const carouselImg = document.getElementById('carousel');
const thumbs = document.querySelectorAll('.thumb-grid img');

function showImage(index) {
  carouselImg.src = carouselImages[index];
  thumbs.forEach(t => t.classList.remove('active'));
  thumbs[index].classList.add('active');
  currentIndex = index;
}

document.getElementById('prevBtn').addEventListener('click', () => {
  let newIndex = currentIndex - 1;
  if(newIndex < 0) newIndex = carouselImages.length - 1;
  showImage(newIndex);
});

document.getElementById('nextBtn').addEventListener('click', () => {
  let newIndex = (currentIndex + 1) % carouselImages.length;
  showImage(newIndex);
});

thumbs.forEach((thumb, index) => {
  thumb.addEventListener('click', () => showImage(index));
});

// Auto-rotate every 12 seconds
setInterval(() => {
  let newIndex = (currentIndex + 1) % carouselImages.length;
  showImage(newIndex);
}, 12000);
</script>
