<script>
const carouselImages = [
  'custom nautical fence.jpg',
  'custom fence.jpg',
  'bridge rebuild.jpg',
  'painted sunroom.jpg',
  'sunroom painted.jpg',
  'customized built in.jpg',
  'cat shelves.jpg',
  'driftwood clock.jpg',
  'custom closet interior.jpg',
  'coffee station with epoxy.jpg', 
  'wall deconstruction.jpg',
  'rehab stairs.jpg',
  'deck complete.jpg',
  'deck in progress.jpg',
  'wall creation.jpg',
  'kitchen renovation.jpg',
  'custom drawers.jpg',
  'custom accent wall.jpg',
  'catwalk and staircase.jpg',
  'floating shelves.jpg',
  'shiplap.jpg',
  'custom built staircase.jpg',
  'custom staircase.jpg',
  'custom cedar box.jpg',
];
let currentIndex = 0;
const carouselImg = document.getElementById('carousel');
const thumbs = document.querySelectorAll('.thumb-grid img');

function showImage(index) {
  // Fade out current image
  carouselImg.style.opacity = 0;

  setTimeout(() => {
    // Change image src after fade out
    carouselImg.src = carouselImages[index];

    // Fade back in
    carouselImg.style.opacity = 1;

    // Update thumbnails
    thumbs.forEach(t => t.classList.remove('active'));
    thumbs[index].classList.add('active');

    currentIndex = index;
  }, 500); // half of transition duration
}

document.getElementById('prevBtn').addEventListener('click', () => {
  let newIndex = currentIndex - 1;
  if(newIndex < 0) newIndex = carouselImages.length - 1;
  showImage(newIndex);
});

document.getElementById('nextBtn').addEventListener('click', () => {
  let newIndex = (currentIndex + 1) % carouselImages.length;
  showImage(newIndex);
});

thumbs.forEach((thumb, index) => {
  thumb.addEventListener('click', () => showImage(index));
});

// Auto-rotate every 12 seconds
setInterval(() => {
  let newIndex = (currentIndex + 1) % carouselImages.length;
  showImage(newIndex);
}, 12000);
</script>
